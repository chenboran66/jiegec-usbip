name: Build jiegec-usbip for Android arm64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取 jiegec/usbip 源码
        uses: actions/checkout@v4
        with:
          repository: jiegec/usbip

      - name: 配置 Rust 与 aarch64-unknown-linux-musl 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: 安装 Zig 与 cargo-zigbuild
        run: |
          pip3 install --break-system-packages ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild

      - name: 为 rusb 开启 vendored 静态链接 libusb
        run: |
          sed -i 's/^rusb = "\([^"]*\)"/rusb = { version = "\1", features = ["vendored"] }/' Cargo.toml
          grep -n "rusb" Cargo.toml

      - name: 静态交叉编译 host 示例程序
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-musl --example host
          file target/aarch64-unknown-linux-musl/release/examples/host

      - name: 打包上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: usbip-host-android-arm64
          path: target/aarch64-unknown-linux-musl/release/examples/host
